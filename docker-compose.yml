services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales_event
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_event"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://sales:sales@postgres:5432/sales_event?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      APP_ENV: development
      API_PORT: 8080
      DATABASE_URL: postgres://sales:sales@postgres:5432/sales_event?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: sales.exchange
      SALES_CREATED_QUEUE: sales.created.queue
      SALE_COMPLETED_QUEUE: sale.completed.queue
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-change-me-email-webhook-secret}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-me-payment-webhook-secret}
      METRICS_PROTECTED: ${METRICS_PROTECTED:-false}
      PUBLIC_RATE_LIMIT_ENABLED: ${PUBLIC_RATE_LIMIT_ENABLED:-true}
      PUBLIC_RATE_LIMIT_REQUESTS_PER_SECOND: ${PUBLIC_RATE_LIMIT_REQUESTS_PER_SECOND:-5}
      PUBLIC_RATE_LIMIT_BURST: ${PUBLIC_RATE_LIMIT_BURST:-10}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    ports:
      - "8080:8080"
    networks:
      - default
      - operational-observability
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      APP_ENV: development
      WORKER_METRICS_PORT: 9091
      WORKER_METRICS_HOST: 0.0.0.0
      DATABASE_URL: postgres://sales:sales@postgres:5432/sales_event?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: sales.exchange
      SALES_CREATED_QUEUE: sales.created.queue
      SALE_COMPLETED_QUEUE: sale.completed.queue
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-generic}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-change-me-email-webhook-secret}
      EMAIL_RETRY_ENABLED: ${EMAIL_RETRY_ENABLED:-true}
      EMAIL_RETRY_INTERVAL: ${EMAIL_RETRY_INTERVAL:-1m}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_INTERVAL: ${RETENTION_INTERVAL:-24h}
      RETENTION_PUBLISHED_OUTBOX_MAX_AGE: ${RETENTION_PUBLISHED_OUTBOX_MAX_AGE:-720h}
      RETENTION_SENT_EMAIL_MAX_AGE: ${RETENTION_SENT_EMAIL_MAX_AGE:-2160h}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    ports:
      - "9091:9091"
    networks:
      - default
      - operational-observability
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - worker

  loki:
    image: grafana/loki:3.2.1
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./deployments/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.2.1
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./deployments/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  operational-observability:
    external: true
    name: operational-observability-network
